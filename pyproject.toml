[project]
name = "sba-risk"
version = "0.1.0"
description = "Kalkulačka rizika odepsání úvěrů s ručením SBA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn==1.9.1",  # uložený model (pickle) funguje jen se stejnou verzí
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
markers = ["slow: pomalý test (instalace balíčku do nového prostředí)"]
